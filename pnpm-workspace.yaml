minimumReleaseAge: 1000 # 4320 # minutes (3 days)
packages:
  - "packages/*"
allowBuilds:
  '@google/genai': true
  '@vscode/vsce-sign': true
  edgedriver: true
  electron: true
  esbuild: true
  geckodriver: true
  keytar: true
  pnpm: true
  protobufjs: true
  unrs-resolver: true

overrides:
  # @vscode/test-cli runs Mocha 11; cypress-multi-reporters must match (see below).
  # Keep it on 11.x until @vscode/test-cli moves to Mocha 12 (renovate.json).
  "cypress-multi-reporters>mocha": "11.8.0"
  # Mocha 12 exports stats-collector as ESM; mocha-junit-reporter requires CJS default export.
  "mocha-junit-reporter>mocha": "12.0.3"
  "mocha-multi-reporters>mocha": "12.0.3"
  rollup: "npm:@rollup/wasm-node@*"
  # VS Code 1.110+ renamed macOS Electron -> Code; Electron symlink removed in
  # 1.131 (microsoft/vscode#326502). @vscode/test-electron 3.1.0 resolves via
  # Info.plist / Contents/MacOS (microsoft/vscode-test#348). Force all
  # consumers (incl. wdio-vscode-service@^2.4.1) onto the fixed release.
  "@vscode/test-electron": "3.1.0"
  # Security overrides
  "@azure/msal-node": ">=7.1.0"
  "@fastify/static": ">=10.1.2 <11.0.0"
  "@hono/node-server": ">=2.1.3 <3.0.0"
  "@xhmikosr/decompress@10": "11.1.4"
  "body-parser": ">=2.4.0 <3.0.0"
  "brace-expansion@1": ">=5.0.8 <6.0.0"
  "brace-expansion@2": ">=5.0.9 <6.0.0"
  "brace-expansion@5": ">=5.0.8 <6.0.0"
  # CVE-2026-118764: force minimatch 11+ on all resolution paths
  "minimatch": ">=11.0.1 <12"
  # minimatch@5/@9 default-import brace-expansion; v5 is named export only
  "minimatch@5": ">=11.0.1 <12"
  "minimatch@9": ">=11.0.1 <12"
  "fast-uri@3": ">=4.2.3 <5.0.0"
  "fast-uri": "4.2.3"
  "fast-xml-parser": ">=5.10.1 <6.0.0"
  "fastify": ">=5.12.6 <6.0.0"
  "find-my-way": ">=9.7.0 <10.0.0"
  "follow-redirects": ">=1.16.2"
  "form-data@4": ">=4.0.6"
  "glob": ">=14.0.2 <15.0.0"
  "js-yaml@5": ">=5.2.2"
  "katex": ">=0.18.2"
  "linkify-it": "<7.0.0"
  "markdown-it": ">=15.0.3 <16.0.0"
  "qs": ">=6.16.1"
  "re2js": ">=2.8.7"
  "postcss": ">=8.5.18 <9.0.0"
  "protobufjs@7": "<9.0.0"
  "serialize-javascript": ">=7.1.3 <8.0.0"
  "source-map-js": ">=1.2.2"
  "tar-fs@3": ">=3.1.2"
  "ws@8": ">=8.17.1"
  "undici@6": "<9.0.0"
  # jsdom@29 imports undici 7 internals removed in undici 8; cap ^7 deps at 7.x
  "undici@7": "<9.0.0"
  "undici@8": "8.12.3"
  "undici": "8.12.3"
  "@electron/get>undici": "8.12.3"
  "cheerio>undici": "8.12.3"
  "wdio-vscode-service>undici": "8.12.3"
  "hono": ">=4.13.11 <5.0.0"
  "ip-address": ">=10.7.4"
  "diff@>=5.0.0 <8.0.3": "9.0.0"
  "file-type@>=13.0.0 <21.3.2": "22.3.0"
  "nanoid@3": "<7.0.0"

patchedDependencies:
  # See: https://github.com/microsoft/vscode-test-cli/issues/106
  "@vscode/test-cli@0.0.15": "patches/@vscode__test-cli@0.0.15.patch"
packageExtensions:
  # @vscode/test-cli runs Mocha 11; e2e reporters must use the same major so
  # createStatsCollector resolves from mocha/lib/stats-collector correctly.
  "cypress-multi-reporters@*":
    "dependencies":
      "mocha": "11.8.0"
  "mocha-junit-reporter@*":
    "dependencies":
      "mocha": "11.8.0"
  "mocha-multi-reporters@*":
    "dependencies":
      "mocha": "12.0.3"
minimumReleaseAgeExclude:
  # Renovate security update: js-yaml@5.2.1 || 5.2.2
  - js-yaml@5.2.1 || 5.2.2
  # Unblocks macOS e2e/wdio after Electron binary rename (see overrides above)
  - "@vscode/test-electron"
  # Renovate security update: brace-expansion@5.0.8 || 5.0.9
  - brace-expansion@5.0.8 || 5.0.9
  # Renovate security update: undici@8.10.0
  - undici@6.28.0 || 7.29.0 || 8.10.0 || 8.12.2 || 8.12.3
  - hono@4.13.1 || 4.13.11 || 4.13.16
  - ip-address@10.5.0 || 10.7.4 || 10.7.5
  - diff@8.0.4
  - file-type@21.3.2
  - nanoid@3.3.18
  # Renovate security update: pnpm@11.11.0
  - pnpm@11.11.0
  # Renovate security update: vitest@4.1.11
  - vitest@4.1.11
  # Renovate security update: @modelcontextprotocol/sdk@1.31.0 || 1.32.0
  - "@modelcontextprotocol/sdk@1.31.0 || 1.32.0"
  # Renovate security update: handlebars@4.7.10
  - handlebars@4.7.10
  # Renovate security update: shell-quote@1.11.0
  - shell-quote@1.11.0
  # Renovate security update: vite@8.3.3
  - vite@8.3.3
  # Renovate security update: electron@44.5.0 || 44.9.1
  - electron@44.5.0 || 44.9.1
  # Renovate security update: @vitest/ui@5.0.5
  - "@vitest/ui@5.0.5"
  - "@vitest/mocker@5.0.3"
  - vitest@5.0.3
  - follow-redirects@1.16.1 || 1.16.2
  - "@azure/msal-node@7.1.0"
  - katex@0.18.2
  - body-parser@2.4.0
  - fast-uri@4.2.3
  - markdown-it@15.0.3
  - serialize-javascript@7.1.3 || 7.1.4
  - source-map-js@1.2.2
  - qs@6.16.1 || 6.17.1
  - re2js@2.8.7
  - "@hono/node-server@2.1.3"
  - fastify@5.12.6
  # Renovate security update: zod@4.6.6
  - zod@4.6.6
  # Renovate security update: glob@14.0.2
  - glob@14.0.2
  # Renovate security update: minimatch@11.0.1
  - minimatch@11.0.1
